name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@v7

      - &setup-node
        name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - &install-dependencies
        name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-node
      - *install-dependencies

      - name: Run TypeScript compiler
        run: npm exec -- tsc --noEmit --incremental false

  package-lock:
    name: Package lock
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-node

      - name: Install dependencies
        run: npm i

      - name: Verify package-lock.json is unchanged
        run: git diff --exit-code -- package-lock.json
